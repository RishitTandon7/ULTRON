<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultron Interface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Face Recognition Section -->
  <div id="face-recognition">
    <div class="scanner">
      <div class="scan-line"></div>
    </div>
    <h2>Scanning Face...</h2>
  </div>

  <!-- Voice Recognition Section -->
  <div id="voice-recognition" style="display: none;">
    <div class="wave-container">
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>
    <h2>Listening...</h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
